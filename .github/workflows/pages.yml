# Builds the site in `site/` and publishes it to GitHub Pages.
#
# It does nothing until the owner turns it on: every job is skipped unless the repository variable PAGES_ENABLED is
# "true". To publish: Settings > Pages > Build and deployment > Source: "GitHub Actions"; then Settings > Secrets and
# variables > Actions > Variables > New repository variable: PAGES_ENABLED = true; then run this workflow (or push).
# Pages on a private repository needs a paid plan; on a public repository it is free. Flip `repoPublic` in
# `site/site.config.ts` when the repository goes public, so the docs' links into it become real links.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "src/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
